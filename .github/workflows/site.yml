# Rebuilds shellrs.com by hand (Actions › site › Run workflow), for when what
# its build reads changed outside a release, such as a section of
# CHANGELOG.md edited after the release went out. A release rebuilds it on
# its own as its last step.
#
# The deploy hook is the `release` environment's secret, so a run waits for
# the same approval as a release.
name: site

on:
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Rebuild shellrs.com
        env:
          SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$SITE_DEPLOY_HOOK"
