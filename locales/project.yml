_version: 2

# 项目: the right sidebar's tool beside local terminals, which keeps local
# terminals in groups.

project.panel.empty:
  zh-CN: 还没有本地终端
  en: No local terminals yet
project.panel.empty_description:
  zh-CN: 在这里新建的本地终端会保存下来，可以放进分组；退出时开着的，下次启动会在原来的文件夹重新打开。
  en: Local terminals you open here are kept, in groups if you like. Those open when you quit come back in the folders they were in next launch.
# A terminal row's mark, as assistive technology reads it.
project.panel.open:
  zh-CN: 已打开
  en: Open
project.panel.closed:
  zh-CN: 未打开
  en: Closed

